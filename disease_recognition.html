<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Recognition</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 0;
        }
        header {
            background: linear-gradient(135deg, #264653, #2a9d8f);
            padding: 40px 0;
            text-align: center;
            color: white;
        }
        header h1 {
            font-size: 3rem;
        }
        .cta-button {
            display: block;
            width: 250px;
            padding: 15px;
            margin: 30px auto;
            text-align: center;
            background-color: #264653;
            color: white;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        .cta-button:hover {
            background-color: #2a9d8f;
            transform: scale(1.05);
        }
        .upload-section {
            text-align: center;
            margin: 50px 10%;
        }
        .upload-section input[type="file"] {
            padding: 15px;
            font-size: 16px;
            width: 100%;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 10px;
        }
        .upload-section button {
            background-color: #264653;
            color: white;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
        }
        .upload-section button:hover {
            background-color: #2a9d8f;
        }
        .result-table {
            margin-top: 30px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            border-collapse: collapse;
        }
        .result-table th, .result-table td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }
        .result-table th {
            background-color: #264653;
            color: white;
        }
        .result-table td {
            background-color: #fff;
        }
        .result {
            text-align: center;
            font-size: 20px;
            margin-top: 30px;
        }
    </style>
</head>
<body>

<header>
    <h1>Plant Disease Recognition</h1>
</header>

<div class="upload-section">
    <h2>Upload Plant Leaf Images for Diagnosis (Up to 3)</h2>
    <input type="file" id="image-upload" accept="image/*" multiple />
    <input type="file" id="image-upload" accept="image/*" multiple />
    <input type="file" id="image-upload" accept="image/*" multiple />
    <button class="cta-button" onclick="predictDisease()">Upload and Predict</button>
</div>

<div id="result" class="result">
    <!-- Prediction results will be shown here -->
</div>

<!-- Result Table for displaying predictions -->
<div id="prediction-table" class="result-table">
    <!-- Results will be inserted here as a table -->
</div>

<script>
// Function to simulate backend prediction and handle image upload
function predictDisease() {
    const fileInput = document.getElementById('image-upload');
    const resultDiv = document.getElementById('result');
    const predictionTable = document.getElementById('prediction-table');

    if (fileInput.files.length > 0) {
        // Clear previous results
        resultDiv.innerHTML = '';
        predictionTable.innerHTML = '';

        const files = fileInput.files;
        let predictions = [];

        // Limit to 3 images
        const numFiles = files.length > 3 ? 3 : files.length;

        // Display uploaded images first
        let imageHtml = '<h3>Uploaded Images:</h3>';
        for (let i = 0; i < numFiles; i++) {
            const file = files[i];
            const reader = new FileReader();
            reader.onload = function (e) {
                imageHtml += `<div><img src="${e.target.result}" alt="Image ${i+1}" style="width: 200px; margin: 10px;" /></div>`;
                resultDiv.innerHTML = imageHtml;
            };
            reader.readAsDataURL(file); // Read image as base64
        }

        // Simulate predictions for each uploaded image
        let tableHtml = `
            <table class="result-table">
                <tr>
                    <th>Image</th>
                    <th>Predicted Disease</th>
                    <th>Confidence</th>
                </tr>
        `;

        // Complete list of possible diseases
        const diseaseNames = [
            "Apple Scab", "Healthy Apple", "Black Rot", "Powdery Mildew", "Leaf Spot", 
            "Cedar Apple Rust", "Fire Blight", "Apple Rust", "Citrus Canker", "Citrus Greening",
            "Tomato Blight", "Tomato Wilt", "Tomato Yellow Leaf Curl Virus", "Bacterial Spot", 
            "Early Blight", "Late Blight", "Anthracnose", "Fusarium Wilt", "Verticillium Wilt",
            "Downy Mildew", "Gray Mold", "Leaf Curl", "Cucumber Mosaic Virus", "Leaf Mold",
            "Septoria Leaf Spot", "Leaf Fleck", "Black Leaf Streak", "Corynespora Leaf Spot"
        ];

        for (let i = 0; i < numFiles; i++) {
            // Simulated prediction result from the model (replace this with backend response)
            const diseaseIndex = i % diseaseNames.length; // Get a disease name based on index
            const confidence = (Math.random() * (20) + 80).toFixed(2); // Confidence between 80% and 100%

            predictions.push({
                image: files[i].name,
                label: diseaseNames[diseaseIndex], // Simulated disease name
                confidence: `${confidence}%` // Simulated confidence
            });

            tableHtml += `
                <tr>
                    <td>${files[i].name}</td>
                    <td>${predictions[i].label}</td>
                    <td>${predictions[i].confidence}</td>
                </tr>
            `;
        }

        tableHtml += '</table>';
        predictionTable.innerHTML = tableHtml;
    } else {
        resultDiv.innerHTML = '<p>Please upload images first.</p>';
    }
}
</script>

</body>
</html>
